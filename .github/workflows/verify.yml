name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Format, lint, typecheck (including the dashboard) and the full test suite.
      # No Bright Data credentials are needed: the client takes an injected fetch,
      # so every test runs offline.
      - run: pnpm verify

      - run: pnpm build

  chaos-matrix:
    # Each mutation must still trigger the finding it simulates. If a mutation
    # stops being detected, the chaos harness has quietly become a demo prop.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: every chaos mutation is detected
        run: pnpm vitest run packages/core/src/chaos.test.ts

      - name: the heal gate rejects a bad preview
        run: pnpm vitest run packages/engine/src/heal.test.ts
