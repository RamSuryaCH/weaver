# Truemeds — product detail pages (PDP)
#
# Long-tail justification: Truemeds is an Indian online pharmacy. Bright Data's
# pre-built scraper library covers none of it, so a custom Scraper Studio
# scraper is the only way to get this data.
#
# Legality: product pages are public and return HTTP 200 without a session.
# robots.txt allows /medicine/ and /otc/ and disallows /search, /cart, /login
# and account paths — none of which appear below. No personal data is collected.
id: truemeds
name: Truemeds
type: pdp
target_url: https://www.truemeds.in
collector_id: null

# Handed verbatim to `bdata scraper create`. Capped at 500 characters by the CLI.
description: >-
  From this medicine product page extract one row: product_url (canonical page
  URL), product_name, composition (active ingredients), mrp (printed maximum
  retail price in INR before discount), selling_price (price payable now in
  INR), currency (ISO code), discount_pct (advertised discount percentage),
  in_stock (true when orderable). Prefer the page's embedded structured data.
  Return prices as plain numbers with no currency symbol.

row_key:
  - product_url

expectations:
  min_rows: 10
  max_row_drop_pct: 30

policy:
  heal: gated
  max_heal_attempts: 3

schema:
  - field: product_url
    description: the canonical URL of this medicine's product page
    type: url
    required: true
    min_fill_rate: 1.0

  - field: product_name
    description: the brand name of the medicine as printed on the product page
    type: string
    required: true
    validate:
      min_length: 3

  - field: composition
    description: >-
      the active ingredients (salts) of the medicine, for example
      "cinnarizine+domperidone", exactly as listed on the page
    type: string
    required: true
    min_fill_rate: 0.8

  - field: mrp
    description: >-
      the printed maximum retail price in rupees, before any discount is applied
    type: number
    required: true
    unit: INR
    validate:
      gt: 0
      lt: 100000
    drift:
      median_shift_pct: 30
      flag_constant: true

  - field: selling_price
    description: >-
      the price in rupees a customer actually pays today, after any discount
    type: number
    required: true
    unit: INR
    validate:
      gt: 0
      lt: 100000
    drift:
      median_shift_pct: 30
      flag_constant: true

  - field: currency
    description: the ISO 4217 currency code the prices are quoted in
    type: string
    required: true
    validate:
      one_of:
        - INR

  - field: discount_pct
    description: >-
      the advertised discount percentage off MRP, when the page shows one
    type: number
    validate:
      gte: 0
      lte: 100

  - field: in_stock
    description: >-
      true when the product can be ordered, false when it is out of stock
    type: boolean

inputs:
  # Ten of these fifteen medicines also appear in dawaadost.yaml and
  # apollo-pharmacy.yaml, which is what makes cross-pharmacy price comparison
  # possible. Kept deliberately small: each URL is one page load of credit.
  urls:
    - https://www.truemeds.in/medicine/pan-40-mg-tablet-10-tm-tacr1-030124
    - https://www.truemeds.in/medicine/pantop-40-mg-tablet-15-tm-tacr1-030358
    - https://www.truemeds.in/medicine/glycomet-500-mg-tablet-10-tm-tacr1-017949
    - https://www.truemeds.in/medicine/allegra-120mg-tablet-10-tm-tacr1-001433
    - https://www.truemeds.in/medicine/zerodol-sp-tablet-tm-tacr1-044727
    - https://www.truemeds.in/medicine/rosuvas-10-mg-tablet-15-tm-tacr1-035086
    - https://www.truemeds.in/medicine/met-xl-25-mg-tablet-15-tm-tacr1-074907
    - https://www.truemeds.in/medicine/thyronorm-25-mcg-tablet-120-tm-tacr1-039965
    - https://www.truemeds.in/medicine/ecosprin-150-mg-tablet-14-tm-tacr1-012743
    - https://www.truemeds.in/medicine/montek-lc-105-mg-tablet-15-tm-tacr1-091644
    - https://www.truemeds.in/otc/dolo-650-mg-tablet-15-tm-tacr1-011691
    - https://www.truemeds.in/medicine/crocin-650-mg-tablet-15-tm-tacr1-009893
    - https://www.truemeds.in/otc/shelcal-500-tablet-40-tm-tacr1-096978
    - https://www.truemeds.in/otc/zincovit-capsule-10-tm-tacr1-053386
    - https://www.truemeds.in/medicine/augmentin-250125-mg-tablet-6-tm-tacr1-003777
